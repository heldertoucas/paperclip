args = ["-e", "for (const k of ['HTTP_PROXY','HTTPS_PROXY','ALL_PROXY','GIT_HTTP_PROXY','GIT_HTTPS_PROXY','http_proxy','https_proxy','all_proxy','git_http_proxy','git_https_proxy','NPM_CONFIG_PROXY','NPM_CONFIG_HTTPS_PROXY','NPM_CONFIG_ALL_PROXY','npm_config_proxy','npm_config_https_proxy','npm_config_all_proxy']) delete process.env[k]; process.env.NPM_CONFIG_OFFLINE = 'false'; process.env.npm_config_offline = 'false'; const { spawn } = require('child_process'); const cmd = process.platform === 'win32' ? 'playwright-mcp.cmd' : 'playwright-mcp'; const child = spawn(cmd, ['--headless'], { stdio: ['inherit', 'inherit', 'pipe'], shell: true, env: process.env }); child.on('error', (err) => { console.error('[MCP Spawn Error] Failed to start ' + cmd + ':', err.message); process.exit(1); }); child.stderr.pipe(process.stderr);"]

